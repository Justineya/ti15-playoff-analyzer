<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TI15 观赛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="live-page">
  <div class="bg-grid"></div>
  <header class="topbar">
    <button type="button" class="brand" id="home-btn" title="回到现场">
      <span class="aegis">TI15</span>
      <span>开战</span>
    </button>
    <div class="top-right">
      <div class="clock-now" id="beijing-now">北京时间 …</div>
      <div class="status" id="odds-status">更新中…</div>
      <div class="history-wrap">
        <button type="button" class="history-btn" id="history-btn" aria-expanded="false" aria-controls="history-menu">历史数据</button>
        <div class="history-menu" id="history-menu" hidden></div>
      </div>
    </div>
  </header>
  <main class="live-main">
    <div id="app">加载中…</div>
  </main>
  <footer>
    <p>现场只打开这一页。不用开 Cursor。非投注建议。</p>
  </footer>
  <script src="./data.js" onerror="document.getElementById('app').textContent='数据文件没下来，刷新一下。'"></script>
  <script src="./odds.js"></script>
  <script src="./analysis.js"></script>
</body>
</html>
