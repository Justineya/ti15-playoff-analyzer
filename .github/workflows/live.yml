name: Live scoreboard

on:
  schedule:
    # GitHub often skips "* * * * *". Two minutes is still late; the page
    # itself polls OpenDota every 4s. This job is the fallback snapshot.
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-score
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot live scoreboard
        run: python3 scripts/fetch_live.py
      - name: Detect a finished map
        id: map
        run: |
          python3 scripts/map_trigger.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("data/cursor-launch.json")
          blob = json.loads(p.read_text()) if p.exists() else {}
          launch = "yes" if blob.get("launch") else "no"
          fresh = "yes" if blob.get("fresh") else "no"
          print("launch", launch, "fresh", fresh, blob.get("reason") or "")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"launch={launch}\n")
              f.write(f"fresh={fresh}\n")
          PY
      - name: Rewrite Game N+1 briefing
        if: steps.map.outputs.fresh == 'yes'
        run: python3 scripts/daily_briefing.py
      - name: Launch Cursor agent for the next map
        if: steps.map.outputs.launch == 'yes'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: python3 scripts/launch_eod_cursor.py
      - name: Commit if the lobby moved
        id: commit
        run: |
          git config user.name "ti15-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/live.json web/data/daily.json web/data/daily.md data/briefing-state.json data/cursor-launch.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no live changes"
            exit 0
          fi
          git commit -m "Auto-refresh live scoreboard."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: live
    if: needs.live.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
