  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="bg-grid"></div>
  <header class="topbar">
    <div class="brand">
      <span class="aegis">TI15</span>
      <span>逐场分析</span>
    </div>
    <nav>
      <a href="./design.html">设计</a>

    <div class="status" id="odds-status">Polymarket …</div>
    <button type="button" class="odds-refresh" id="odds-refresh" title="从 Polymarket 拉最新价格">刷新赔率</button>
  </header>
  <main>
    <section class="hero">
      <p class="kicker">只做八强的 TI15 场次 · 8/20–8/23</p>
      <h1>对阵图、每局 5 次 BP 模拟，再估先到 10 杀、胜率和 Polymarket 回报率。</h1>
      <p class="lede">
        参与次数 = 击杀 + 助攻，不再写「出几刀」。助攻来自同一波团战伤害或同团阵亡（OpenDota 没有逐次助攻日志）。
        淘汰赛四天格子都在对阵图里；后面场次一出，用已算好的情景预测就能看。
      </p>
    </section>
    <div class="filters" id="filters"></div>
    <div id="app">加载数据…</div>
  </main>
  <footer>
    <p>上海观赛只打开本页。数据由 GitHub Actions 自动更新。赔率已烧进页面；国内点「刷新赔率」可能失败。非投注建议。</p>
  </footer>
